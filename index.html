<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Studio — Canvas Prototype</title>
<style>
:root{--accent:#8C63FF;--accent-soft:#f0eaff;--ink:#4b4e63;--muted:#a4a7bf;--line:#edf0f7;--page:#f5f7fb;--cyan:#2dc8f4}
*{box-sizing:border-box}
body{margin:0;background:var(--page);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:0 auto;padding:14px 16px;min-height:100vh;display:grid;grid-template-columns:64px minmax(0,1fr) 290px;gap:16px}
.toolbar,.canvas-panel,.sections-panel{background:#fff;border:1px solid #eef0f7;border-radius:18px;box-shadow:0 5px 24px rgba(43,49,84,.055)}
.toolbar{align-self:start;position:sticky;top:14px;padding:10px 7px;display:flex;flex-direction:column;align-items:center;gap:7px}
.tool{width:46px;height:46px;border:0;border-radius:12px;background:transparent;color:#a9acc4;display:grid;place-items:center;transition:.15s;position:relative}
.tool:hover,.tool:focus-visible{background:var(--accent-soft);color:var(--accent);outline:none}
.tool.active{background:var(--accent-soft);color:var(--accent)}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool-sep{height:1px;width:34px;background:var(--line);margin:3px 0}
.canvas-panel{padding:24px 30px 26px;min-width:0;min-height:calc(100vh - 28px);display:flex;flex-direction:column}
.canvas-header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:19px;margin-bottom:24px}
.section-title{display:flex;align-items:center;gap:10px;font-size:27px;font-weight:650;letter-spacing:-.5px;margin:0;min-width:0}
.section-title button{border:0;background:transparent;color:#a8abc4;padding:5px;border-radius:7px}
.section-title button:hover{background:var(--accent-soft);color:var(--accent)}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #e5e7f0;background:#fff;color:#696d84;border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600}
.btn:hover{border-color:#cfc2ff;color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:white}
.btn.primary:hover{background:#7750ee}
.canvas{flex:1;border:1px solid #f0f2f8;border-radius:10px;padding:20px;min-height:600px}
.empty{min-height:550px;display:flex;align-items:center;justify-content:center;text-align:center;color:#8b8fa9}
.empty-inner{max-width:390px}
.book{font-size:42px;margin-bottom:18px}
.empty p{font-size:18px;line-height:1.5;margin:0 0 18px}
.empty .btn{font-size:14px;padding:11px 17px}
.blocks{display:flex;flex-direction:column;gap:14px}
.block{border:1px solid #e9eaf3;border-radius:12px;padding:16px 17px;background:#fff;position:relative}
.block:hover{border-color:#d7ccff}
.block-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.block-kind{display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:750;color:#9b9eb5}
.kind-icon{display:grid;place-items:center;width:26px;height:26px;background:#f5f1ff;color:var(--accent);border-radius:7px;font-size:14px}
.block-actions{display:flex;gap:5px}
.icon-btn{border:0;background:transparent;color:#a4a7bb;border-radius:6px;width:29px;height:29px}
.icon-btn:hover{background:#f3f0ff;color:var(--accent)}
.block textarea,.block input[type=text]{width:100%;border:1px solid #e7e9f1;border-radius:8px;padding:11px 12px;color:#4b4e63;outline:none;background:#fff}
.block textarea:focus,.block input:focus{border-color:#b9a6ff;box-shadow:0 0 0 3px #f1edff}
.block textarea{min-height:86px;resize:vertical;line-height:1.5}
.block .hint{font-size:12px;color:#a0a3b7;margin-top:7px}
.image-placeholder{min-height:150px;border:1px dashed #d8dbea;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#a0a4ba;background:#fafbfe;padding:15px}
.image-placeholder input{max-width:220px;font-size:12px}
.image-placeholder img{max-width:100%;max-height:320px;object-fit:contain;border-radius:7px}
.media-row{display:grid;grid-template-columns:1fr;gap:9px}
.media-row input{width:100%;padding:10px;border:1px solid #e7e9f1;border-radius:8px}
.picture-match{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.match-card{border:1px solid #e8eaf3;border-radius:9px;padding:10px;text-align:center;background:#fafbfe}
.match-card .match-image{height:72px;display:grid;place-items:center;font-size:28px;color:#c0c3d4;border:1px dashed #d8dbea;border-radius:7px;margin-bottom:8px}
.match-card input{width:100%;min-width:0;border:1px solid #e2e5ef;border-radius:6px;padding:7px;font-size:12px}
.add-match{border:1px dashed #d4c9ff;background:#fbf9ff;color:var(--accent);border-radius:9px;min-height:135px;font-weight:700}
.picture-editor{border:1px solid #ececf5;border-radius:10px;padding:14px;background:#fff}
.match-instructions{width:100%;min-height:54px;resize:vertical;border:0;background:#f5f6fa;border-radius:9px;padding:12px;color:#6c7791;margin-bottom:12px}
.match-word-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;background:#f5f6fa;border-radius:9px;margin-bottom:14px}
.match-chip{background:#fff;border:1px solid #eeeef5;border-radius:7px;padding:5px 9px;color:#737d96;font-size:13px}
.picture-match{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px 12px;align-items:start}
.match-card{min-width:0;position:relative}
.match-card .match-image{height:125px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#c0c3d4;background:#f7f8fb;border:1px solid transparent;border-radius:9px;overflow:hidden;position:relative}
.match-card .match-image img{width:100%;height:100%;object-fit:contain}
.match-card input[type=text]{width:100%;height:35px;margin-top:7px;border:1.5px solid var(--accent);border-radius:6px;padding:5px 8px;font-size:13px}
.match-card input[type=file]{width:100%;font-size:10px;margin-top:6px}
.match-card .remove-match{position:absolute;right:-6px;top:-7px;border:1px solid #e5e5f0;background:white;color:#aab2c5;border-radius:50%;width:22px;height:22px;z-index:2}
.add-match{border:1px solid #e5e4f0;background:#fff;color:var(--accent);border-radius:9px;min-height:125px;font-size:28px}
.match-crop-backdrop{position:fixed;inset:0;background:#29283b88;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px}
.match-crop-modal{background:white;border-radius:14px;padding:22px;width:min(560px,100%);box-shadow:0 18px 60px #16132a30}
.match-crop-stage{width:min(100%,420px);aspect-ratio:1;background:#f6f6f8;overflow:hidden;position:relative;margin:auto;cursor:grab;touch-action:none}
.match-crop-stage img{position:absolute;max-width:none;max-height:none;user-select:none;pointer-events:none}
.match-crop-stage:after{content:"";position:absolute;inset:0;border:2px solid var(--accent);pointer-events:none}
.match-crop-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:650px){.picture-match{grid-template-columns:repeat(2,minmax(0,1fr))}}
.add-block-row{display:flex;justify-content:center;padding:8px 0 0}
.add-inline{border:1px dashed #d9dbea;background:#fbfcff;color:#8c8fa8;border-radius:9px;padding:10px 15px;font-size:13px}
.add-inline:hover{border-color:#bba9ff;background:#faf7ff;color:var(--accent)}
.sections-panel{align-self:start;position:sticky;top:14px;padding:16px 16px 14px}
.panel-title{font-size:16px;font-weight:700;margin:0 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.section-list{display:flex;flex-direction:column;gap:3px}
.section-item{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:0;border-radius:7px;background:transparent;color:#a0a4bf;padding:9px 6px;font-size:14px;line-height:1.25}
.section-item:hover{background:#f8f6ff;color:#7f61d7}
.section-item.selected{color:#4b4e63;background:#faf9ff;box-shadow:inset 3px 0 var(--accent)}
.drag-mark{color:#b4b7cc;font-weight:800;letter-spacing:-2px}
.add-section{display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#a0a4bf;padding:10px 5px;font-size:14px}
.add-section:hover{color:var(--accent)}
.panel-footer{margin-top:10px;padding-top:13px;border-top:1px solid var(--line);font-size:13px;color:#a0a4bf;display:flex;align-items:center;gap:8px}
.drawer{position:fixed;z-index:10;left:88px;top:14px;width:285px;max-height:calc(100vh - 28px);overflow:auto;background:#fff;border:1px solid #ececf5;border-radius:16px;box-shadow:0 12px 38px rgba(37,41,74,.16);padding:17px;display:none}
.drawer.open{display:block}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.drawer h2{font-size:17px;margin:0}
.drawer p{font-size:12px;color:#999db2;line-height:1.45;margin:7px 0 14px}
.drawer-close{border:0;background:transparent;color:#9da0b4;font-size:23px}
.library-group{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:#b0b2c4;margin:15px 0 7px}
.library-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 9px;border:1px solid transparent;background:white;border-radius:9px;text-align:left;color:#565970}
.library-item:hover{background:#faf8ff;border-color:#e7deff}
.library-icon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#f3efff;color:var(--accent);font-size:18px;flex:none}
.library-item strong{display:block;font-size:13px}
.library-item small{display:block;color:#a1a4b8;font-size:11px;margin-top:3px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#38384a;color:white;padding:10px 15px;border-radius:9px;font-size:13px;display:none;z-index:30}

/* Exercises from the constructors */
.ex-summary{border:1px solid #ececf5;border-radius:10px;padding:14px;background:#fff}
.ex-summary h3{margin:0 0 4px;font-size:17px;font-weight:650}
.ex-instr{margin:0 0 12px;color:#8b8fa9;font-size:13px}
.ex-missing{color:#b4b7cc;font-weight:500}
.ex-text{line-height:2.1;color:#4b4e63;font-size:15px}
.ex-text p{margin:0}.ex-text ol,.ex-text ul{margin:2px 0;padding-left:24px}
.ex-gap{display:inline-block;border:1.5px solid #4FCBF2;border-radius:7px;padding:0 10px;line-height:1.7;margin:0 3px;font-weight:500}
.ex-label{margin-top:7px;font-size:13px;font-weight:600;color:#4b4e63;overflow-wrap:anywhere}
.ex-summary .picture-match{margin-top:4px}
.ex-empty{color:#a0a4ba;font-size:14px;padding:22px 14px;text-align:center;border:1px dashed #d8dbea;border-radius:9px;background:#fafbfe}
.ex-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:#8e92a9;border-top:1px solid #eeeef5;margin-top:14px;padding-top:12px}
.ex-meta .btn{margin-left:auto}
.exercise-frame-wrap{position:fixed;inset:0;z-index:100;background:#fff}
.exercise-frame{display:block;width:100%;height:100%;border:0}
.pv-overlay{position:fixed;inset:0;z-index:90;overflow:auto;background:#fff}
.pv-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.pv-bar h2{margin:0;font-size:20px}
.pv-bar small{display:block;color:#a0a4bf;font-size:12px;font-weight:500;margin-top:2px}
.pv-body{max-width:880px;margin:0 auto;padding:10px 20px 80px}
.pv-block{padding:24px 0;border-bottom:1px solid #f0f2f8;line-height:1.55}
.pv-block:last-child{border-bottom:0}
.pv-block img{max-width:100%;max-height:420px;border-radius:8px}
.pv-empty{color:#8b8fa9;padding:30px 0}

/* Section options (three dots) */
.section-row{position:relative}
.section-row .section-item{padding-right:36px}
.section-kebab{position:absolute;right:4px;top:5px;width:28px;height:28px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:#a0a4bf;opacity:0;transition:opacity .12s,background .12s}
.section-kebab svg{width:16px;height:16px;fill:currentColor}
.section-row:hover .section-kebab,.section-kebab:focus-visible,.section-row.menu-open .section-kebab{opacity:1}
.section-kebab:hover,.section-kebab:focus-visible,.section-row.menu-open .section-kebab{background:#f3f0ff;color:var(--accent);outline:none}
@media(hover:none){.section-kebab{opacity:1}}
.section-menu{position:absolute;right:0;top:38px;z-index:20;width:230px;padding:6px;background:#fff;border:1px solid #ececf5;border-radius:11px;box-shadow:0 10px 30px rgba(37,41,74,.16)}
.section-menu-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;text-align:left}
.section-menu-item.danger{color:#d84a55}
.section-menu-item.danger:hover:not(:disabled){background:#fff0f1}
.section-menu-item:disabled{opacity:.45;cursor:not-allowed}
.section-menu-item svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.section-menu-note{margin:2px 10px 6px;font-size:12px;line-height:1.45;color:#8e92a9}
.section-menu-text{margin:6px 8px 10px;font-size:13px;line-height:1.45;color:#4b4e63}
.section-menu-actions{display:flex;justify-content:flex-end;gap:6px;padding:0 4px 4px}
.btn.danger{background:#ef626b;border-color:#ef626b;color:#fff}
.btn.danger:hover{background:#d84a55;border-color:#d84a55;color:#fff}
.add-block-row[hidden]{display:none}
.tool.is-inactive{cursor:default;color:#c6c9d8}
.tool.is-inactive:hover,.tool.is-inactive:focus-visible{background:transparent;color:#c6c9d8}
.tool.is-inactive:focus-visible{box-shadow:inset 0 0 0 2px #e4e6f0}
@media(max-width:900px){.app{grid-template-columns:52px minmax(0,1fr);gap:10px;padding:10px}.sections-panel{grid-column:2;position:static;order:3}.canvas-panel{padding:18px;min-height:auto}.toolbar{top:10px}.drawer{left:68px;top:10px}.canvas{min-height:400px}}
@media(max-width:560px){.app{grid-template-columns:1fr}.toolbar{position:static;flex-direction:row;justify-content:center;grid-row:1;flex-wrap:wrap}.tool{width:42px;height:42px}.tool-sep{height:28px;width:1px}.canvas-panel{grid-row:2;padding:15px}.sections-panel{grid-column:1;grid-row:3}.canvas-header{align-items:flex-start;flex-direction:column}.section-title{font-size:23px}.canvas{padding:12px;min-height:350px}.empty{min-height:320px}.drawer{left:10px;right:10px;top:10px;width:auto;max-height:80vh}}
</style>
</head>
<body>
<div class="app" id="lessonStudio">
  <nav class="toolbar" aria-label="Learning tools">
    <button class="tool is-inactive" type="button" aria-disabled="true" title="Personal dictionary (coming soon)" aria-label="Personal dictionary, coming soon"><svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v15H6.5A2.5 2.5 0 0 0 4 19.5z"/><path d="M4 5v15a2 2 0 0 0 2 2h14M9 7h7M9 11h5"/></svg></button>
    <button class="tool is-inactive" type="button" aria-disabled="true" title="Grammar notes (coming soon)" aria-label="Grammar notes, coming soon"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg></button>
    <div class="tool-sep"></div>
    <button class="tool is-inactive" type="button" aria-disabled="true" title="Timer (coming soon)" aria-label="Timer, coming soon"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9.5 2h5M12 2v3"/></svg></button>
  </nav>

  <main class="canvas-panel">
    <header class="canvas-header">
      <h1 class="section-title"><span id="currentSectionTitle">Section 1</span><button id="renameSection" title="Rename section" aria-label="Rename section">✎</button></h1>
      <div class="top-actions"><button class="btn" id="previewBtn" type="button">Preview</button><button class="btn" id="clearCanvas">Clear section</button><button class="btn primary" id="saveLesson">Save lesson</button></div>
    </header>
    <section class="canvas" aria-label="Lesson canvas">
      <div id="blocks" class="blocks"></div>
      <div id="emptyState" class="empty">
        <div class="empty-inner"><div class="book">📖</div><p>There are no elements yet.<br>Choose an element from the library or add an exercise.</p><button class="btn primary" id="emptyAdd">Add an element</button></div>
      </div>
      <div class="add-block-row" id="addAnother" hidden><button class="add-inline" id="addAnotherBtn">＋ Add an element</button></div>
    </section>
  </main>

  <aside class="sections-panel">
    <h2 class="panel-title">Sections</h2>
    <div class="section-list" id="sectionList"></div>
    <button class="add-section" id="addSection"><span style="font-size:22px;line-height:1">＋</span> Add section</button>
    <div class="panel-footer">⌂ <strong>Lesson workspace</strong></div>
  </aside>
</div>

<div class="drawer" id="libraryDrawer" role="dialog" aria-label="Element library" aria-modal="false">
  <div class="drawer-head"><h2 id="drawerTitle">Content elements</h2><button class="drawer-close" id="closeDrawer" aria-label="Close library">×</button></div>
  <p id="drawerDescription">Add information and media to your lesson canvas.</p>
  <div id="libraryItems"></div>
</div>
<div class="match-crop-backdrop" id="matchCropBackdrop" style="display:none" role="dialog" aria-modal="true" aria-label="Crop image">
  <div class="match-crop-modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:22px">Crop</h2><button class="icon-btn" id="matchCropClose" aria-label="Close cropper">×</button></div>
  <div class="match-crop-stage" id="matchCropStage"><img id="matchCropImage" alt="Image crop preview"></div>
  <p class="hint">Drag the image to reposition it. Use zoom to adjust the square crop.</p>
  <div class="match-crop-actions"><button class="btn" id="matchZoomOut">− Zoom</button><button class="btn" id="matchZoomIn">＋ Zoom</button><button class="btn" id="matchCropReset">Reset</button></div>
  <div class="match-crop-actions"><button class="btn" id="matchCropCancel">Cancel</button><button class="btn primary" id="matchCropSave">Save crop</button></div></div>
</div>
<div class="exercise-frame-wrap" id="exerciseFrameWrap" hidden></div>
<div class="pv-overlay" id="previewOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="pvTitle"><div class="pv-bar"><div><h2 id="pvTitle"></h2><small>Student preview</small></div><button class="btn" id="pvClose" type="button">Close preview</button></div><div class="pv-body" id="pvBody"></div></div>

cise-number\">1.1<\/span><input class=\"heading-input\" id=\"exerciseHeading\" placeholder=\"Enter the heading\" aria-label=\"Exercise heading\"><\/div><textarea class=\"instructions-input\" id=\"exerciseInstructions\" placeholder=\"Add instructions for students (optional)\" aria-label=\"Instructions\"><\/textarea><div class=\"word-bank\" id=\"teacherWordBank\" aria-label=\"Word bank\"><span class=\"small-note\">Labels you enter below will appear here automatically.<\/span><\/div><div class=\"image-grid\" id=\"imageGrid\"><\/div><div class=\"toast\" id=\"editorToast\" aria-live=\"polite\"><\/div><\/section>\n<section id=\"settingsView\" class=\"view hidden\"><div class=\"settings-list\"><div class=\"setting-row\"><div class=\"setting-label\">Hide from students <span class=\"help-dot\" title=\"Hidden exercises won't appear in the student lesson.\">?<\/span><\/div><input id=\"hideStudents\" class=\"switch\" type=\"checkbox\" aria-label=\"Hide from students\"><\/div><div class=\"setting-row\"><div class=\"setting-label\">Auto-check of answers <span class=\"help-dot\" title=\"Choose when answers are checked.\">?<\/span><\/div><select id=\"autoCheck\" class=\"setting-select\"><option value=\"during\">In the process of performing the exercise<\/option><option value=\"after\">After completing the exercise<\/option><\/select><\/div><div class=\"setting-row\"><div class=\"setting-label\">Execution Time <span class=\"help-dot\" title=\"Set an optional time limit for this activity.\">?<\/span><\/div><div><label style=\"display:flex;align-items:center;gap:12px;font-weight:500\"><input id=\"timed\" class=\"switch\" type=\"checkbox\" aria-label=\"Enable execution time\"> Enable time limit<\/label><div id=\"timeLimitWrap\" class=\"hidden\" style=\"margin-top:12px;max-width:180px\"><label for=\"timeLimit\">Time limit (minutes)<\/label><input id=\"timeLimit\" type=\"number\" min=\"1\" max=\"180\" value=\"5\" style=\"width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px\"><\/div><\/div><\/div><\/div><\/section>\n<section id=\"statisticsView\" class=\"view hidden\"><div class=\"settings-list\"><div class=\"setting-row\"><div class=\"setting-label\">Include in statistics <span class=\"help-dot\" title=\"Include student scores in lesson reporting.\">?<\/span><\/div><input id=\"includeStats\" class=\"switch\" type=\"checkbox\" aria-label=\"Include in statistics\"><button class=\"stat-help\" id=\"statisticsHelp\"><span>\u2b50<\/span>What is statistics?<\/button><\/div><\/div><\/section>\n<section id=\"libraryView\" class=\"view hidden\"><div class=\"library-head\"><div><h1>My Lessons<\/h1><p class=\"small-note\">Saved locally in this browser.<\/p><\/div><div class=\"library-actions\"><button class=\"soft-btn\" id=\"importJson\">Import JSON<\/button><input id=\"importFile\" type=\"file\" accept=\"application/json,.json\" class=\"hidden\"><button class=\"soft-btn primary\" id=\"newLesson\">\uff0b Create lesson<\/button><\/div><\/div><div class=\"lesson-meta\"><div><label for=\"lessonTitle\">Lesson title<\/label><input id=\"lessonTitle\" type=\"text\" placeholder=\"e.g. Anatomy vocabulary\"><\/div><div><label for=\"lessonStatus\">Status<\/label><select id=\"lessonStatus\"><option>Draft<\/option><option>Ready to publish<\/option><\/select><\/div><\/div><div><label for=\"lessonDescription\">Lesson introduction (optional)<\/label><input id=\"lessonDescription\" type=\"text\" placeholder=\"A short introduction for students\" style=\"width:100%;margin-top:6px\"><\/div><div class=\"library-head\" style=\"margin-top:26px\"><h2 style=\"font-size:18px;margin:0\">Your lessons<\/h2><span class=\"small-note\" id=\"lessonCount\"><\/span><\/div><div id=\"lessonList\"><\/div><div class=\"small-note\" style=\"margin-top:18px\">This prototype stores lessons in this browser. Export JSON backups regularly, especially if you upload images.<\/div><\/section>\n<section id=\"previewView\" class=\"view hidden\"><div class=\"library-head\"><div><h1>Student preview<\/h1><p class=\"small-note\">Try the activity as a learner would.<\/p><\/div><div class=\"library-actions\"><button class=\"soft-btn\" id=\"backToEditor\">\u2190 Back to editor<\/button><button class=\"soft-btn primary\" id=\"exportStudent\">Export student HTML<\/button><\/div><\/div><div class=\"student-shell\" id=\"studentPreview\"><\/div><\/section>\n<\/main>\n<div class=\"bottom-bar\" id=\"bottomBar\"><button id=\"cancelButton\">Cancel<\/button><button class=\"save-btn\" id=\"saveButton\">Save<\/button><\/div>\n<div class=\"modal-backdrop hidden\" id=\"sourceModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sourceTitle\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"sourceTitle\">Add an image<\/h2><button class=\"modal-close\" data-close=\"sourceModal\" aria-label=\"Close\">\u00d7<\/button><\/div><div class=\"source-options\"><button id=\"chooseUpload\"><span class=\"menu-icon\">\u2b06<\/span>Upload<\/button><button id=\"choosePaste\"><span class=\"menu-icon\">\ud83d\udccb<\/span>Paste image<\/button><\/div><input type=\"file\" id=\"imageFile\" accept=\"image/*\" class=\"hidden\"><p class=\"crop-note\">Copied a picture from another website? Press Ctrl+V (\u2318V on a Mac) to paste it here.<\/p><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"cropModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"cropTitle\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"cropTitle\">Crop<\/h2><button class=\"modal-close\" data-close=\"cropModal\" aria-label=\"Close\">\u00d7<\/button><\/div><div class=\"crop-stage\" id=\"cropStage\"><img id=\"cropImage\" alt=\"Selected image to crop\"><\/div><p class=\"crop-note\">Drag the image to choose which part to keep inside the square. Use the zoom controls to adjust the crop.<\/p><div class=\"toolbar\" style=\"justify-content:flex-end;margin-top:10px\"><button class=\"soft-btn\" id=\"zoomOut\">\u2212<\/button><button class=\"soft-btn\" id=\"zoomIn\">\uff0b<\/button><button class=\"soft-btn\" id=\"resetCrop\">Reset<\/button><\/div><div class=\"modal-actions\"><button id=\"cancelCrop\">Cancel<\/button><button class=\"primary\" id=\"saveCrop\">Save<\/button><\/div><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"helpModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"helpTitle\"><div class=\"modal help-modal\"><div class=\"modal-head\"><h2 id=\"helpTitle\">Drag the word to the image<\/h2><button class=\"modal-close\" data-close=\"helpModal\" aria-label=\"Close\">\u00d7<\/button><\/div><p>Add an image, then enter its correct word in the field below it. Lesson Studio automatically builds a word bank from your labels.<\/p><p>In the student preview, learners drag words into the fields below the images. Correct placements are highlighted in green. Incorrect placements return to the word bank and the target is highlighted in red when auto-checking is enabled during the exercise.<\/p><div class=\"modal-actions\"><button class=\"primary\" data-close=\"helpModal\">Got it<\/button><\/div><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"statsModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"statsTitle\"><div class=\"modal help-modal\"><div class=\"modal-head\"><h2 id=\"statsTitle\">What is statistics?<\/h2><button class=\"modal-close\" data-close=\"statsModal\" aria-label=\"Close\">\u00d7<\/button><\/div><p>Including an exercise in statistics allows its results to contribute to lesson performance summaries.<\/p><p>In this local prototype, the setting is saved with the exercise. Shared student profiles, class rankings, and central reporting would require a student account system and a shared database.<\/p><div class=\"modal-actions\"><button class=\"primary\" data-close=\"statsModal\">Got it<\/button><\/div><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"confirmModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"confirmTitle\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"confirmTitle\">Discard changes?<\/h2><button class=\"modal-close\" data-close=\"confirmModal\" aria-label=\"Close\">\u00d7<\/button><\/div><p>Unsaved changes will be lost.<\/p><div class=\"modal-actions\"><button data-close=\"confirmModal\" id=\"keepEditing\">Keep editing<\/button><button class=\"primary\" id=\"discardChanges\">Discard changes<\/button><\/div><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"askModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"askTitle\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"askTitle\"><\/h2><button class=\"modal-close\" data-close=\"askModal\" aria-label=\"Close\">\u00d7<\/button><\/div><p id=\"askText\"><\/p><div class=\"modal-actions\"><button type=\"button\" id=\"askCancel\">Cancel<\/button><button type=\"button\" class=\"primary\" id=\"askOk\">OK<\/button><\/div><\/div><\/div>\n<div class=\"float-toast hidden\" id=\"floatToast\" role=\"status\" aria-live=\"polite\"><\/div>\n<script>\n(()=>{\n'use strict';\nconst STORE='lessonStudioV5Lessons';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));const uid=()=>`ex${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;\nlet lessons=[],lesson=null,original=null,activeTab='exercise',pendingImage=null,pendingIndex=null,cropZoom=1,dragWord=null,studentState=null,dirty=false;\nfunction load(){try{const a=JSON.parse(localStorage.getItem(STORE)||'[]');lessons=Array.isArray(a)?a:[]}catch(e){lessons=[]}}\nfunction persist(){try{localStorage.setItem(STORE,JSON.stringify(lessons));return true}catch(e){notify('Browser storage is full. Export a JSON backup and use fewer or smaller images.');return false}}\nfunction freshLesson(){return{id:uid(),title:'Untitled lesson',status:'Draft',description:'',exercise:{id:uid(),type:'dragImage',heading:'',instructions:'',items:[],settings:{hide:false,autoCheck:'during',timed:false,timeLimit:5,includeStats:false}},updated:new Date().toISOString()}}\nfunction markDirty(){dirty=true}\nfunction setTab(tab){activeTab=tab;['exercise','settings','statistics','library','preview'].forEach(t=>$(t+'View').classList.toggle('hidden',t!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('bottomBar').classList.toggle('hidden',tab==='library'||tab==='preview');if(tab==='exercise')renderEditor();if(tab==='library')renderLibrary();if(tab==='preview')renderStudentPreview()}\nfunction showModal(id){$(id).classList.remove('hidden')}function hideModal(id){$(id).classList.add('hidden')}\nfunction ensure(){if(!lesson)lesson=freshLesson();if(!lesson.exercise)lesson.exercise=freshLesson().exercise;lesson.exercise.items ||= [];lesson.exercise.settings ||= {hide:false,autoCheck:'during',timed:false,timeLimit:5,includeStats:false}}\nfunction newLesson(){lesson=freshLesson();original=JSON.stringify(lesson);dirty=false;$('lessonTitle').value=lesson.title;$('lessonStatus').value='Draft';$('lessonDescription').value='';setTab('exercise');fillSettings();renderEditor()}\nfunction loadLesson(id){const found=lessons.find(x=>x.id===id);if(!found)return;lesson=JSON.parse(JSON.stringify(found));if(!lesson.exercise){lesson=freshLesson();}ensure();original=JSON.stringify(lesson);dirty=false;$('lessonTitle').value=lesson.title||'Untitled lesson';$('lessonStatus').value=lesson.status||'Draft';$('lessonDescription').value=lesson.description||'';fillSettings();setTab('exercise')}\nfunction readMeta(){if(!lesson)return;lesson.title=$('lessonTitle').value.trim()||'Untitled lesson';lesson.status=$('lessonStatus').value;lesson.description=$('lessonDescription').value.trim()}\nfunction fillSettings(){ensure();const s=lesson.exercise.settings;$('hideStudents').checked=!!s.hide;$('autoCheck').value=s.autoCheck||'during';$('timed').checked=!!s.timed;$('timeLimit').value=s.timeLimit||5;$('timeLimitWrap').classList.toggle('hidden',!s.timed);$('includeStats').checked=!!s.includeStats}\nfunction wordBankMarkup(){const words=(lesson.exercise.items||[]).map((it,i)=>({label:it.label.trim(),i})).filter(x=>x.label);if(!words.length)return '<span class=\"small-note\">Labels you enter below will appear here automatically.<\/span>';return words.map(x=>`<span class=\"word-chip\" draggable=\"true\" data-word-index=\"${x.i}\" title=\"Drag to reorder the word bank later\">${esc(x.label)}<\/span>`).join('')}\nfunction renderEditor(){if(!lesson)return;ensure();$('exerciseHeading').value=lesson.exercise.heading||'';$('exerciseInstructions').value=lesson.exercise.instructions||'';$('teacherWordBank').innerHTML=wordBankMarkup();const grid=$('imageGrid');grid.innerHTML='';lesson.exercise.items.forEach((it,i)=>{const card=document.createElement('div');card.className='image-item';card.innerHTML=`<div class=\"image-frame\">${it.image?`<img src=\"${it.image}\" alt=\"Image ${i+1}\"><button class=\"recrop-image\" type=\"button\" aria-label=\"Crop image ${i+1}\" title=\"Crop image\">Crop<\/button>`:`<button class=\"soft-btn upload-placeholder\" type=\"button\">Upload image<\/button>`}<\/div><button class=\"remove-image\" type=\"button\" title=\"Remove image\" aria-label=\"Remove image ${i+1}\">\u00d7<\/button><input class=\"label-input\" type=\"text\" value=\"${esc(it.label)}\" placeholder=\"Enter the word\" aria-label=\"Label for image ${i+1}\"><span class=\"tiny-status\" aria-hidden=\"true\"><\/span>`;const img=card.querySelector('img');if(img){img.addEventListener('click',()=>openSource(i));const recrop=card.querySelector('.recrop-image');recrop.onclick=()=>{pendingIndex=i;startCrop(it.image)}}card.querySelector('.remove-image').onclick=()=>{ask('Remove this picture?','The picture and its word will be removed from the exercise.','Remove').then(ok=>{if(ok){lesson.exercise.items.splice(i,1);markDirty();renderEditor()}})};const lab=card.querySelector('.label-input');lab.addEventListener('input',()=>{lesson.exercise.items[i].label=lab.value;markDirty();$('teacherWordBank').innerHTML=wordBankMarkup()});const up=card.querySelector('.upload-placeholder');if(up)up.onclick=()=>openSource(i);grid.appendChild(card)});\nconst wrap=document.createElement('div');wrap.className='add-wrap';wrap.innerHTML=`<button type=\"button\" class=\"add-tile\" id=\"addTile\" aria-label=\"Add an image\"><span class=\"add-plus\" aria-hidden=\"true\">+<\/span><\/button><div class=\"add-menu hidden\" id=\"addMenu\"><button type=\"button\" id=\"menuUpload\"><span class=\"menu-icon\">\u2b06<\/span>Upload<\/button><button type=\"button\" id=\"menuPaste\"><span class=\"menu-icon\">\ud83d\udccb<\/span>Paste image<\/button><\/div>`;grid.appendChild(wrap);$('addTile').onclick=()=>{$('addMenu').classList.toggle('hidden')};$('menuUpload').onclick=()=>{pendingIndex=null;$('addMenu').classList.add('hidden');openSource(null)};$('menuPaste').onclick=()=>{$('addMenu').classList.add('hidden');pendingIndex=null;pasteFromClipboard()};document.addEventListener('click',outsideAddMenu,{once:true});$('editorToast').textContent=dirty?'Unsaved changes.':' '}\nfunction outsideAddMenu(e){const menu=$('addMenu');if(menu&&!menu.contains(e.target)&&e.target.id!=='addTile'){menu.classList.add('hidden')}if($('addMenu'))document.addEventListener('click',outsideAddMenu,{once:true})}\nfunction openSource(index){pendingIndex=index;showModal('sourceModal')}\n$('chooseUpload').onclick=()=>{$('imageFile').click()};$('choosePaste').onclick=()=>pasteFromClipboard();\n$('imageFile').onchange=()=>{const file=$('imageFile').files?.[0];$('imageFile').value='';if(file)useImageFile(file)};\nfunction readData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}\nlet cropOffsetX=0,cropOffsetY=0,cropDrag=null,cropBaseScale=1;\nfunction prepareCropImage(){const img=$('cropImage'),stage=$('cropStage');if(!img||!img.naturalWidth||!stage)return;const side=stage.clientWidth||480;cropBaseScale=Math.max(side/img.naturalWidth,side/img.naturalHeight);const w=img.naturalWidth*cropBaseScale,h=img.naturalHeight*cropBaseScale;img.style.width=w+'px';img.style.height=h+'px';img.style.left='50%';img.style.top='50%';img.style.marginLeft=(-w/2)+'px';img.style.marginTop=(-h/2)+'px';img.style.transform=`translate(${cropOffsetX}px,${cropOffsetY}px) scale(${cropZoom})`;clampCropOffsets()}\nfunction clampCropOffsets(){const stage=$('cropStage'),img=$('cropImage');if(!stage||!img||!img.naturalWidth)return;const side=stage.clientWidth||480;const w=img.naturalWidth*cropBaseScale*cropZoom,h=img.naturalHeight*cropBaseScale*cropZoom;const maxX=Math.max(0,(w-side)/2),maxY=Math.max(0,(h-side)/2);cropOffsetX=Math.max(-maxX,Math.min(maxX,cropOffsetX));cropOffsetY=Math.max(-maxY,Math.min(maxY,cropOffsetY));img.style.transform=`translate(${cropOffsetX}px,${cropOffsetY}px) scale(${cropZoom})`}\nfunction zoomCrop(n){cropZoom=Math.max(1,Math.min(4,cropZoom+n));clampCropOffsets()}\n$('zoomIn').onclick=()=>zoomCrop(.1);$('zoomOut').onclick=()=>zoomCrop(-.1);$('resetCrop').onclick=()=>{cropZoom=1;cropOffsetX=0;cropOffsetY=0;prepareCropImage()};\n$('cropStage').addEventListener('pointerdown',e=>{if(!pendingImage)return;cropDrag={x:e.clientX,y:e.clientY,ox:cropOffsetX,oy:cropOffsetY};$('cropStage').classList.add('is-dragging');$('cropStage').setPointerCapture?.(e.pointerId)});\n$('cropStage').addEventListener('pointermove',e=>{if(!cropDrag)return;cropOffsetX=cropDrag.ox+(e.clientX-cropDrag.x);cropOffsetY=cropDrag.oy+(e.clientY-cropDrag.y);clampCropOffsets()});\nfunction endCropDrag() {cropDrag=null;$('cropStage').classList.remove('is-dragging')}\n$('cropStage').addEventListener('pointerup',endCropDrag);$('cropStage').addEventListener('pointercancel',endCropDrag);\n$('cancelCrop').onclick=()=>{pendingImage=null;cropDrag=null;hideModal('cropModal')};\n$('saveCrop').onclick=async()=>{if(!pendingImage)return;let image;try{image=await cropToSquareDataUrl($('cropImage'),cropZoom,cropOffsetX,cropOffsetY,cropBaseScale)}catch(e){notify('This image could not be cropped. Try another image.');return}if(pendingIndex===null||pendingIndex===undefined){lesson.exercise.items.push({id:uid(),image,label:''})}else{lesson.exercise.items[pendingIndex].image=image}pendingImage=null;hideModal('cropModal');markDirty();renderEditor()};\nasync function cropToSquareDataUrl(img,zoom,offsetX,offsetY,baseScale){return new Promise((resolve,reject)=>{const iw=img.naturalWidth,ih=img.naturalHeight;if(!iw||!ih){reject(new Error('Image is not ready'));return}const stageSide=$('cropStage').clientWidth||480;const scale=(baseScale||Math.max(stageSide/iw,stageSide/ih))*zoom;const side=Math.min(iw,ih,stageSide/scale);const centerX=iw/2-(offsetX||0)/scale;const centerY=ih/2-(offsetY||0)/scale;const sx=Math.max(0,Math.min(iw-side,centerX-side/2));const sy=Math.max(0,Math.min(ih-side,centerY-side/2));const c=document.createElement('canvas');c.width=600;c.height=600;const ctx=c.getContext('2d');if(!ctx){reject(new Error('Canvas unavailable'));return}ctx.drawImage(img,sx,sy,side,side,0,0,600,600);resolve(c.toDataURL('image/jpeg',.92))})}\nfunction saveLesson(){if(!lesson)return;readMeta();ensure();lesson.updated=new Date().toISOString();const idx=lessons.findIndex(x=>x.id===lesson.id);const copy=JSON.parse(JSON.stringify(lesson));if(idx<0)lessons.unshift(copy);else lessons[idx]=copy;if(persist()){original=JSON.stringify(lesson);dirty=false;$('editorToast').textContent='Saved in this browser.';renderLibrary()}}\nfunction renderLibrary(){const root=$('lessonList');root.innerHTML='';$('lessonCount').textContent=`${lessons.length} lesson${lessons.length===1?'':'s'}`;if(!lessons.length){root.innerHTML='<div class=\"empty-state\">Your lesson library is empty. Create your first lesson to begin.<\/div>';return}lessons.forEach(l=>{const n=l.exercise?.items?.length||0;const card=document.createElement('div');card.className='library-card';card.innerHTML=`<div><h3>${esc(l.title||'Untitled lesson')}<\/h3><div class=\"small-note\">${n} image item${n===1?'':'s'} \u00b7 Updated ${new Date(l.updated||Date.now()).toLocaleDateString()}<\/div><div style=\"margin-top:7px\"><span class=\"badge\" style=\"display:inline-block;background:#F3EEFF;color:#7656DA;border-radius:6px;padding:3px 7px;font-size:11px\">${esc(l.status||'Draft')}<\/span><\/div><\/div><div class=\"library-actions\"><button class=\"soft-btn edit\">Edit<\/button><button class=\"soft-btn preview\">Preview<\/button><button class=\"soft-btn export\">Export JSON<\/button><button class=\"soft-btn delete\">Delete<\/button><\/div>`;card.querySelector('.edit').onclick=()=>loadLesson(l.id);card.querySelector('.preview').onclick=()=>{lesson=JSON.parse(JSON.stringify(l));ensure();setTab('preview')};card.querySelector('.export').onclick=()=>download(JSON.stringify(l,null,2),slug(l.title)+'.json','application/json');card.querySelector('.delete').onclick=()=>{ask('Delete this lesson?',`\u201c${l.title}\u201d will be removed from this browser.`,'Delete').then(ok=>{if(ok){lessons=lessons.filter(x=>x.id!==l.id);persist();renderLibrary()}})};root.appendChild(card)})}\nfunction slug(s){return String(s||'lesson').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'lesson'}function download(text,name,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}\n/* ===== Shared drag module: one system for mouse, touch and pen (Pointer Events) ===== */\nfunction makeDragKit(){\n return function attach(root,o){\n  const source=o.source||'[data-drag]',target=o.target||'[data-drop]',THRESHOLD=6;\n  const api={lastDrop:0,lastTap:0};let s=null;\n  root.addEventListener('pointerdown',e=>{\n   if(s||(e.pointerType==='mouse'&&e.button!==0))return;\n   const el=e.target.closest(source);if(!el||!root.contains(el))return;\n   s={el,id:el.dataset.drag,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,touch:e.poin iseInstructions\" placeholder=\"Add instructions for students (optional)\" aria-label=\"Instructions\"><\/textarea>\n <div style=\"position:relative\"><div class=\"gap-editor is-empty\" id=\"gapEditor\" contenteditable=\"true\" role=\"textbox\" aria-multiline=\"true\" aria-label=\"Exercise text\" data-placeholder=\"Type or paste your text here. Then highlight a word or phrase and choose Skip to turn it into a gap.\"><\/div><\/div>\n <div class=\"editor-help\"><span>Highlight a word or phrase, then choose <b>Skip<\/b> to make a gap. Click a gap to edit its answer.<\/span><span id=\"gapCount\">No gaps yet<\/span><\/div>\n <div class=\"extra-words\" id=\"extraWordsWrap\"><label for=\"extraWords\">Extra words for the word bank <span class=\"small-note\">(optional, separate with ;)<\/span><\/label><input id=\"extraWords\" type=\"text\" placeholder=\"e.g. went; going\" autocomplete=\"off\"><\/div>\n <p class=\"type-note\" id=\"typeNote\"><\/p>\n<\/section>\n<section id=\"settingsView\" class=\"view hidden\"><div class=\"settings-list\"><div class=\"setting-row\"><div class=\"setting-label\">Hide from students <span class=\"help-dot\" title=\"Hidden exercises won't appear in the student lesson.\">?<\/span><\/div><input id=\"hideStudents\" class=\"switch\" type=\"checkbox\" aria-label=\"Hide from students\"><\/div><div class=\"setting-row\"><div class=\"setting-label\">Auto-check of answers <span class=\"help-dot\" title=\"Choose when answers are checked.\">?<\/span><\/div><select id=\"autoCheck\" class=\"setting-select\"><option value=\"during\">In the process of performing the exercise<\/option><option value=\"after\">After completing the exercise<\/option><\/select><\/div><div class=\"setting-row\"><div class=\"setting-label\">Execution Time <span class=\"help-dot\" title=\"Set an optional time limit for this activity.\">?<\/span><\/div><div><label style=\"display:flex;align-items:center;gap:12px;font-weight:500\"><input id=\"timed\" class=\"switch\" type=\"checkbox\" aria-label=\"Enable execution time\"> Enable time limit<\/label><div id=\"timeLimitWrap\" class=\"hidden\" style=\"margin-top:12px;max-width:180px\"><label for=\"timeLimit\">Time limit (minutes)<\/label><input id=\"timeLimit\" type=\"number\" min=\"1\" max=\"180\" value=\"5\" style=\"width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px\"><\/div><\/div><\/div><\/div><\/section>\n<section id=\"statisticsView\" class=\"view hidden\"><div class=\"settings-list\"><div class=\"setting-row\"><div class=\"setting-label\">Include in statistics <span class=\"help-dot\" title=\"Include student scores in lesson reporting.\">?<\/span><\/div><input id=\"includeStats\" class=\"switch\" type=\"checkbox\" aria-label=\"Include in statistics\"><\/div><\/div><\/section>\n<section id=\"previewView\" class=\"view hidden\"><div class=\"library-head\"><div><h1>Student preview<\/h1><p class=\"small-note\">Try the activity as a learner would.<\/p><\/div><div class=\"library-actions\"><button class=\"soft-btn\" id=\"backToEditor\">\u2190 Back to editor<\/button><\/div><\/div><div class=\"student-shell\" id=\"studentPreview\"><\/div><\/section>\n<\/main>\n<div class=\"bottom-bar\" id=\"bottomBar\"><button id=\"cancelButton\">Cancel<\/button><button class=\"save-btn\" id=\"saveButton\">Save<\/button><\/div>\n\n<div class=\"sel-toolbar hidden\" id=\"selToolbar\" role=\"toolbar\" aria-label=\"Text options\">\n <button type=\"button\" class=\"sel-skip\" id=\"skipBtn\"><span class=\"brackets\">[ ]<\/span>Skip<\/button>\n <div class=\"sel-row\">\n  <button type=\"button\" class=\"sel-btn\" data-panel=\"color\" title=\"Text colour\" aria-label=\"Text colour\"><span class=\"sel-color\">A<span class=\"bar\" id=\"colorBar\" style=\"background:#3F4A62\"><\/span><\/span><\/button>\n  <button type=\"button\" class=\"sel-btn\" data-panel=\"highlight\" title=\"Highlighter\" aria-label=\"Highlighter\"><svg viewBox=\"0 0 24 24\"><path d=\"m15 5 4 4-9 9H6v-4z\"/><path d=\"M4 21h16 me.<\/p><p>Separate several accepted answers with a semicolon, for example <i>don't; do not<\/i>. Capital letters don't matter when answers are checked.<\/p><div class=\"modal-actions\"><button class=\"primary\" data-close=\"helpModal\">Got it<\/button><\/div><\/div><\/div>\n<div class=\"modal-backdrop hidden\" id=\"confirmModal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"confirmTitle\"><div class=\"modal\"><div class=\"modal-head\"><h2 id=\"confirmTitle\">Discard changes?<\/h2><button class=\"modal-close\" data-close=\"confirmModal\" aria-label=\"Close\">\u00d7<\/button><\/div><p>Your changes since the last save will be lost.<\/p><div class=\"modal-actions\"><button data-close=\"confirmModal\" type=\"button\">Keep editing<\/button><button class=\"primary\" id=\"discardChanges\" type=\"button\">Discard changes<\/button><\/div><\/div><\/div>\n<div class=\"float-toast hidden\" id=\"floatToast\" role=\"status\" aria-live=\"polite\"><\/div>\n<script>\nfunction makeDragKit(){\n return function attach(root,o){\n  const source=o.source||'[data-drag]',target=o.target||'[data-drop]',THRESHOLD=6;\n  const api={lastDrop:0,lastTap:0};let s=null;\n  root.addEventListener('pointerdown',e=>{\n   if(s||(e.pointerType==='mouse'&&e.button!==0))return;\n   const el=e.target.closest(source);if(!el||!root.contains(el))return;\n   s={el,id:el.dataset.drag,sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,pid:e.pointerId,touch:e.pointerType!=='mouse',drag:false,ghost:null,over:null,raf:0};\n   addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',up);addEventListener('pointercancel',end);\n  });\n  function move(e){\n   if(!s||e.pointerId!==s.pid)return;s.x=e.clientX;s.y=e.clientY;\n   if(!s.drag){if(Math.hypot(s.x-s.sx,s.y-s.sy)<THRESHOLD)return;begin()}\n   e.preventDefault();position();hit();\n  }\n  function begin(){\n   const r=s.el.getBoundingClientRect();s.dx=s.sx-r.left;s.dy=s.sy-r.top;\n   const g=s.el.cloneNode(true);g.removeAttribute('dat olours and dots show the result */\n function say(t,tone,final){if(!final){t='';tone=''}fb.textContent=t||'';fb.className='gsp-feedback'+(tone?' '+tone:'')}\n function shake(n){if(!n)return;n.classList.remove('is-shake');void n.offsetWidth;n.classList.add('is-shake')}\n function start(){\n  const tpl=document.createElement('template');tpl.innerHTML=ex.html||'';\n  tpl.content.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});\n  gaps=[];\n  tpl.content.querySelectorAll('.gap').forEach(span=>{\n   const answers=split(span.dataset.answers);if(!answers.length){span.remove();return}\n   const k=gaps.length,g={k,answers,options:split(span.dataset.wrong),value:null,placed:null,locked:false,bad:false,tries:0,revealed:false,revealLabel:'',tried:new Set()};gaps.push(g);\n   const w=Math.max(5,...answers.map(a=>a.length))+3;let node;\n   if(type==='drag'){node=document.createElement('span');node.className='gsp-slot';node.dataset.drop=k;node.tabIndex=0;node.setAttribute('role','button')}\n   else if(type==='write'){node=document.createElement('input');node.className='gsp-input';node.type='text';node.autocomplete='off';node.spellcheck=false;node.setAttribute('autocapitalize','off');node.setAttribute('aria-label',`Gap ${k+1}`)}\n   else{node=document.createElement('select');node.className='gsp-select';node.setAttribute('aria-label',`Gap ${k+1}`);\n    const opts=shuffle([answers[0],...g.options.filter(o=>!answers.some(a=>norm(a)===norm(o)))]);\n    node.innerHTML='<option value=\"\">\u2026<\/option>'+opts.map(o=>`<option>${esc(o)}<\/option>`).join('')}\n   node.dataset.k=k;node.style.setProperty('--w',w+'ch');\n   const wrap=document.createElement('span');wrap.className='gsp-gap';wrap.append(node);wrap.insertAdjacentHTML('beforeend',`<span class=\"gsp-tries\" aria-hidden=\"true\">${'<i><\/i>'.repeat(MAX_TRIES)}<\/span>`);span.replaceWith(wrap);\n  });\n  text.replaceChildren(tpl.content);\n  if(!gaps.length)text.innerHTML='<p class=\"gsp-note\">Highlight words in the editor and choose Skip to create gaps.<\/p>';\n  words=type==='drag'?shuffle(gaps.map(g=>({id:'w'+g.k,label:g.answers[0],at:null})).concat(split(ex.distractors).map((d,i)=>({id:'x'+i,label:d,at:null})))):[];\n  selected=null;mistakes=0;done=false;if(checkBtn)checkBtn.hidden=!gaps.length;say('');paint();\n }\n function paint(focusId){\n  gaps.forEach(g=>{const n=el(g.k);n.parentNode.querySelectorAll('.gsp-tries i').forEach((d,i)=>d.classList.toggle('on',i<g.tries));n.classList.toggle('is-revealed',g.revealed)});\n  if(type!=='drag'){gaps.forEach(g=>{const n=el(g.k);n.classList.toggle('is-correct',g.locked&&!g.revealed);n.classList.toggle('is-wrong',g.bad);if(type==='write')n.readOnly=g.locked;else{n.disabled=g.locked;n.querySelectorAll('option').forEach(o=>{o.disabled=!!o.value&&g.tried.has(norm(o.value))})}n.setAttribute('aria-label',`Gap ${g.k+1}`+(g.revealed?', answer shown':g.tries&&!g.locked?`, ${MAX_TRIES-g.tries} tries left`:''))});return}\n  const hadFocus=app.contains(document.activeElement)&&document.activeElement.matches('[data-drag]');\n  const chip=w=>`<button type=\"button\" class=\"gsp-chip${selected===w.id?' is-selected':''}\" data-drag=\"${w.id}\" aria-pressed=\"${selected===w.id}\">${esc(w.label)}<\/button>`;\n  const free=words.filter(w=>w.at===null);\n  bank.innerHTML=free.length?free.map(chip).join(''):`<span class=\"gsp-note\">${done?'':gaps.length?'All words are placed.':'No words yet.'}<\/span>`;\n  gaps.forEach(g=>{const n=el(g.k),w=g.placed&&word(g.placed);\n   const lockedLabel=g.locked?(w?w.label:g.revealLabel):'';\n   n.classList.toggle('is-correct',g.locked&&!g.revealed);n.classList.toggle('is-wrong',g.bad&&!w);\n   n.innerHTML=g.locked?esc(lockedLabel):w?chip(w):'';\n   n.setAttribute('aria-label',`Gap ${g.k+1}: `+(g.revealed?`answer shown, ${lockedLabel}`:g.locked?`correct, ${lockedLabel}`:w?`holds ${w.label}`:'empty')+(g.tries&&!g.locked?`, ${MAX_TRIES-g.tries} tries left`:''));\n   if(g.locked)n.removeAttribute('tabindex');else n.tabIndex=0});\n  app.classList.toggle('is-armed',!!selected);\n  if(selected){hint.textContent=`Now ${fine?'click':'tap'} the gap where \u201c${word(selected).label}\u201d belongs.`;hint.classList.add('is-active')}\n  else{hint.textContent=done||!gaps.length?'':`Drag a word into a gap, or ${fine?'click':'tap'} a word and then the gap.`;hint.classList.remove('is-active')}\n  const f=focusId||(hadFocus?selected:null);if(f){const c=app.querySelector(`[data-drag=\"${f}\"]`);if(c)c.focus({preventScroll:true})}\n }\n function finish(){\n  done=true;selected=null;if(checkBtn)checkBtn.hidden=true;paint();\n  const shown=gaps.filter(g=>g.revealed).length;\n  say(shown?`Done! You filled ${gaps.length-shown} of ${gaps.length} gaps yourself. Mistakes: ${mistakes}.`:mistakes?`Excellent! You filled every gap. Mistakes: ${mistakes}.`:'Perfect! You filled every gap on the first try.',shown?'':'good');\n  if(opts.onComplete)opts.onComplete({total:gaps.length,mistakes,shown});\n }\n /* A wrong answer uses one of the gap's tries; after the last one the correct answer is filled in */\n /* The same wrong answer twice never costs a second try */\n const repeat=(g,v)=>g.tried.has(norm(v));\n function miss(g,v){g.tried.add(norm(v));g.tries++;mistakes++;if(g.tries<MAX_TRIES){g.bad=true;return false}\n  g.revealed=true;g.locked=true;g.bad=false;\n  if(type==='drag'){if(g.placed){const p=word(g.placed);if(p)p.at=null;g.placed=null}const w=words.find(x=>x.at===null&&isRight(g,x.label));if(w){w.at=g.k;g.placed=w.id}else g.revealLabel=g.answers[0]}\n  else{el(g.k).value=g.answers[0];g.value=g.answers[0]}\n  return true}\n const missMsg=g=>{const n=MAX_TRIES-g.tries;return `Not quite. ${n} ${n===1?'try':'tries'} left for this gap.`};\n const allLocked=()=>gaps.every(g=>g.locked);\n /* --- drag --- */\n function place(id,k){\n  if(done)return;const w=word(id),g=gaps[k];if(!w||!g||g.locked)return;selected=null;\n  if(auto==='during'){\n   if(isRight(g,w.label)){w.at=k;g.placed=id;g.locked=true;g.bad=false;if(allLocked())return finish();say('Correct!','good');paint()}\n   else{if(repeat(g,w.label)){paint();return}if(miss(g,w.label)){paint();if(allLocked())return finish();say('');return}paint();shake(el(k));say(missMsg(g),'bad');setTimeout(()=>{if(g.bad&&!g.locked){g.bad=false;paint()}},900)}\n   return}\n  if(w.at!==null)gaps[w.at].placed=null;\n  if(g.placed){const prev=word(g.placed);if(prev)prev.at=null}\n  g.placed=id;w.at=k;g.bad=false;\n  say(gaps.every(x=>x.placed)?'All gaps are filled. Press \u201cCheck answers\u201d when you are ready.':'');paint();\n }\n function unplace(id){const w=word(id);if(!w||w.at===null||gaps[w.at].locked)return;gaps[w.at].placed=null;w.at=null;paint(id)}\n function tap(id){const w=word(id);if(!w||done)return;if(w.at!==null){unplace(id);return}selected=selected===id?null:id;paint(id)}\n /* --- check (after mode, all types) --- */\n function check(){\n  if(done)return;selected=null;const wrong=[];\n  gaps.forEach(g=>{\n   if(g.locked)return;\n   if(type==='drag'){const w=g.placed&&word(g.placed);if(w&&isRight(g,w.label)){g.locked=true;return}if(w){w.at=null;g.placed=null;if(repeat(g,w.label))return;if(!miss(g,w.label))wrong.push(g.k)}}\n   else{const v=el(g.k).value;if(v.trim()&&isRight(g,v)){g.locked=true;g.bad=false;return}if(v.trim()){if(repeat(g,v)){g.bad=true;wrong.push(g.k);return}if(!miss(g,v))wrong.push(g.k)}}\n  });\n  if(allLocked())return finish();\n  paint();wrong.forEach(k=>shake(el(k)));\n  const good=gaps.filter(g=>g.locked&&!g.revealed).length;\n  say(`${good} of ${gaps.length} correct.`+(wrong.length?(type==='drag'?' The wrong words went back to the bank.':' Fix the answers marked in red.'):' Fill in the remaining gaps.')+'','bad');\n }\n /* --- write-in and drop-down, checked while working --- */\n function commit(k){\n  const g=gaps[k],n=el(k);if(!g||g.locked||done)return;const v=n.value;if(auto==='during'&&v===g.value)return;g.value=v;\n  if(auto!=='during'){if(g.bad){g.bad=false;paint()}return}\n  if(!v.trim()){g.bad=false;paint();return}\n  if(isRight(g,v)){g.locked=true;g.bad=false;paint();if(allLocked())return finish();say('Correct!','good');\n   if(type==='write'){const next=gaps.find(x=>!x.locked&&x.k>k)||gaps.find(x=>!x.locked);if(next&&document.activeElement===n)el(next.k).focus()}}\n  else{if(repeat(g,v)){g.bad=true;paint();return}if(miss(g,v)){paint();if(allLocked())return finish();say('');return}paint();shake(n);say(missMsg(g),'bad')}\n }\n if(type==='drag'){\n  const dk=DragKit(app,{onTap:tap,onDrop(id,t){selected=null;if(t){place(id,+t.dataset.drop);return}const w=word(id);if(w&&w.at!==null)unplace(id);else paint()}});\n  text.addEventListener('click',e=>{if(e.target.closest('[data-drag]')||Date.now()-dk.lastDrop<400)return;const s=e.target.closest('[data-drop]');if(s&&selected)place(selected,+s.dataset.drop)});\n  text.addEventListener('keydown',e=>{if(!e.target.matches('[data-drop]')||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();if(selected)place(selected,+e.target.dataset.drop);else{hint.textContent='Choose a word first, then its gap.';hint.classList.add('is-active')}});\n  app.addEventListener('click',e=>{const c=e.target.closest('[data-drag]');if(c){if(e.detail===0)tap(c.dataset.drag);return}if(selected&&!e.target.closest('[data-drop]')&&!e.target.closest('button')){selected=null;paint()}});\n  app.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;paint()}});\n }else{\n  text.addEventListener('change',e=>{const n=e.target.closest('[data-k]');if(n)commit(+n.dataset.k)});\n  text.addEventListener('input',e=>{const n=e.target.closest('[data-k]');if(!n)return;const g=gaps[+n.dataset.k];if(g&&g.bad){g.bad=false;paint()}});\n  text.addEventListener('keydown',e=>{const n=e.target.closest('input[data-k]');if(n&&e.key==='Enter'){e.preventDefault();commit(+n.dataset.k)}});\n }\n q('[data-act=\"reset\"]').onclick=start;if(checkBtn)checkBtn.onclick=check;\n start();\n return {reset:start};\n}\n\n/* ===== Editor ===== */\n(()=>{\n'use strict';\nconst STORE='lessonStudioGapsDraft';\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst uid=()=>`ex${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;\nconst split=s=>String(s||'').split(';').map(x=>x.trim()).filter(Boolean);\nconst first=s=>split(s)[0]||'';\nconst DragKit=makeDragKit();\nconst editor=$('gapEditor'),bar=$('selToolbar'),pop=$('gapPop');\nconst TEXT_COLORS=['#3F4A62','#8C93A8','#D84A55','#F08A24','#E0B000','#19A46B','#2A8BD8','#7048E8'];\nconst HIGHLIGHTS=['none','#FFF1A8','#FFD9C7','#FFD3E2','#D7F5DD','#D4EEFF','#E6DCFF','#E9EAF0'];\nconst NOTES={drag:'Students drag words from a word bank into the gaps. The first answer of each gap goes into the word bank; any other answers you separate with ; are also accepted.',\n write:'Students type each answer with no options given. Every answer you separate with ; is accepted. Capital letters and extra spaces don\u2019t matter, but spelling and accents do.',\n select:'Students choose from a drop-down list in each gap: the first correct answer plus the wrong options you add to that gap. Gaps marked with an orange dot still need wrong options.'};\nlet ex,saved,dirty=false,activeTab='exercise',savedRange=null,popGap=null;\n\nfunction fresh(){return{id:uid(),type:'drag',heading:'',instructions:'',html:'',distractors:'',settings:{hide:false,autoCheck:'during',timed:false,timeLimit:5,includeStats:false},updated:null}}\nfunction load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&typeof x==='object'){const f=fresh();return{...f,...x,settings:{...f.settings,...(x.settings||{})}}}}catch(e){}return fresh()}\nfunction notify(msg){const t=$('floatToast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(notify.t);notify.t=setTimeout(()=>t.classList.add('hidden'),2800)}\nfunction showModal(id){$(id).classList.remove('hidde ;sync()}\n\n/* --- type, tabs, settings --- */\nfunction applyType(){$('typeSelect').value=ex.type;$('extraWordsWrap').classList.toggle('hidden',ex.type!=='drag');$('typeNote').textContent=NOTES[ex.type];refreshGaps();if(popGap)openPop(popGap,false)}\nfunction setTab(tab){activeTab=tab;closePop();hideToolbar();['exercise','settings','statistics','preview'].forEach(t=>$(t+'View').classList.toggle('hidden',t!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('bottomBar').classList.toggle('hidden',tab==='preview');if(tab==='preview'){ex.html=serialize();mountGapPlayer($('studentPreview'),ex,DragKit)}}\nfunction fillAll(){$('exerciseHeading').value=ex.heading||'';$('exerciseInstructions').value=ex.instructions||'';editor.innerHTML=sanitize(ex.html);$('extraWords').value=ex.distractors||'';const s=ex.settings;$('hideStudents').checked=!!s.hide;$('autoCheck').value=s.autoCheck||'during';$('timed').checked=!!s.timed;$('timeLimit').value=s.timeLimit||5;$('timeLimitWrap').classList.toggle('hidden',!s.timed);$('includeStats').checked=!!s.includeStats;applyType()}\nfunction save(){ex.html=serialize();ex.updated=new Date().toISOString();try{localStorage.setItem(STORE,JSON.stringify(ex));saved=JSON.stringify(ex);dirty=false;notify('Saved in this browser.')}catch(e){notify('This browser couldn\u2019t save the exercise. Its storage may be full or blocked.')}}\nfunction cancel(){ex.html=serialize();if(dirty&&JSON.stringify(ex)!==saved)showModal('confirmModal');else notify('No unsaved changes.')}\n\n/* --- events --- */\ndocument.addEventListener('selectionchange',()=>{clearTimeout(updateToolbar.t);updateToolbar.t=setTimeout(updateToolbar,80)});\nbar.addEventListener('mousedown',e=>{if(!e.target.closest('input'))e.preventDefault()});\nbar.addEventListener('click',e=>{\n const b=e.target.closest('button');if(!b)return;\n if(b.id==='skipBtn'){doSkip();return}\n if(b.dataset.panel){togglePanel(b.dataset.panel);return}\n if(b.d getSelection().removeAllRanges()}});\naddEventListener('resize',()=>{if(popGap)placeFloating(pop,popGap.getBoundingClientRect(),10);else if(savedRange&&!bar.classList.contains('hidden'))placeFloating(bar,savedRange.getBoundingClientRect())});\n$('typeSelect').onchange=()=>{ex.type=$('typeSelect').value;ex.html=serialize();applyType();markDirty();notify('Students will now see: '+$('typeSelect').selectedOptions[0].text+'.')};\n$('exerciseHeading').oninput=()=>{ex.heading=$('exerciseHeading').value;markDirty()};\n$('exerciseInstructions').oninput=()=>{ex.instructions=$('exerciseInstructions').value;markDirty()};\n$('extraWords').oninput=()=>{ex.distractors=$('extraWords').value;markDirty()};\n$('hideStudents').onchange=()=>{ex.settings.hide=$('hideStudents').checked;markDirty()};\n$('autoCheck').onchange=()=>{ex.settings.autoCheck=$('autoCheck').value;markDirty()};\n$('timed').onchange=()=>{ex.settings.timed=$('timed').checked;$('timeLimitWrap').classList.toggle('hidden',!$('timed').checked);markDirty()};\n$('timeLimit').oninput=()=>{ex.settings.timeLimit=Math.max(1,Math.min(180,Number($('timeLimit').value)||5));markDirty()};\n$('includeStats').onchange=()=>{ex.settings.includeStats=$('includeStats').checked;markDirty()};\ndocument.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));\n$('previewButton').onclick=()=>setTab('preview');$('backToEditor').onclick=()=>setTab('exercise');\n$('saveButton').onclick=save;$('cancelButton').onclick=cancel;$('closeButton').onclick=cancel;\n$('discardChanges').onclick=()=>{hideModal('confirmModal');ex=JSON.parse(saved);dirty=false;fillAll();notify('Changes discarded.')};\n$('helpButton').onclick=()=>showModal('helpModal');\ndocument.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hideModal(b.dataset.close));\ndocument.querySelectorAll('.modal-backdrop').forEach(back=>back.addEventListener('click',e=>{if(e.target===back)hideModal(back.id)}));\n\nbuildSwatches();\n/* ===== Opened from the lesson ca <style>/* ===== Student player ===== */
.gsp{color:#44506A}
.gsp h1{font-size:26px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.gsp-instr{color:#8993A8;margin:0 0 18px}
.gsp-bank{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-height:68px;padding:12px;background:#F5F6FA;border-radius:12px;z-index:5}
.gsp-chip{appearance:none;font:inherit;font-size:16px;font-weight:600;color:#4A566F;background:#fff;border:1.5px solid #E3E4EE;border-radius:9px;min-height:44px;padding:8px 14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;box-shadow:0 1px 2px #2B305412;transition:transform .12s,box-shadow .12s,border-color .12s,opacity .12s}
.gsp-chip:hover{border-color:#CFC2FF}
.gsp-chip:focus-visible{outline:3px solid #8C63FF66;outline-offset:2px}
.gsp-chip.is-selected{border-color:#8C63FF;background:#F3EEFF;color:#7048E8;transform:translateY(-2px);box-shadow:0 6px 14px #8C63FF33}
.gsp-chip.dk-source{opacity:.3}
.dk-ghost{position:fixed!important;left:0;top:0;margin:0!important;z-index:1000;pointer-events:none;border-color:#8C63FF!important;background:#fff!important;color:#4A566F!important;opacity:1!important;box-shadow:0 14px 30px #2B305445!important;transition:none!important}
html.dk-dragging,html.dk-dragging *{cursor:grabbing!important}
.gsp-note{color:#8993A8;font-size:14px}
.gsp-hint{min-height:22px;margin:10px 2px 6px;font-size:14px;color:#8993A8}
.gsp-hint.is-active{color:#7048E8;font-weight:600}
.gsp-text{margin-top:10px;font-size:17px;line-height:2.55;color:#3F4A62;overflow-wrap:anywhere}
.gsp-text p{margin:0}.gsp-text ol,.gsp-text ul{margin:4px 0;padding-left:26px}
.gsp-text a{color:#2A8BD8}
.gsp-slot{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:var(--w,7ch);max-width:100%;min-height:42px;margin:2px 3px;padding:2px 5px;border:1.5px dashed #C9CDDD;border-radius:9px;background:#fff;color:#A0A8BC;font-size:15px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s}
.gsp-slot:focus-visible{outline:3px solid #8C63FF66;outline-offset:2px}
.gsp-slot .gsp-chip{min-height:34px;padding:3px 11px}
.gsp.is-armed .gsp-slot:not(.is-correct){border-color:#BBA9FF;background:#FBF9FF}
.gsp-slot.is-over{border-style:solid;border-color:#8C63FF;background:#F3EEFF}
.gsp-input,.gsp-select{font:inherit;font-size:16px;height:40px;margin:2px 3px;border:1.5px solid #C9CDDD;border-radius:9px;background:#fff;color:#3F4A62;vertical-align:middle;max-width:100%}
.gsp-input{width:var(--w,8ch);padding:0 9px}
.gsp-select{padding:0 6px;min-width:7ch}
.gsp-input:focus,.gsp-select:focus{outline:0;border-color:#8C63FF;box-shadow:0 0 0 3px #F1EDFF}
.gsp .is-correct{border:1.5px solid #19C783!important;background:#E9FFF5!important;color:#13895A!important;font-weight:700;opacity:1;cursor:default}
.gsp .is-wrong{border:1.5px solid #EF626B!important;background:#FFF0F1!important;color:#D84A55!important}
.gsp .is-revealed{border:1.5px solid #19C783!important;background:#fff!important;color:#13895A!important;font-weight:700;opacity:1;cursor:default}
.gsp-gap{display:inline-flex;align-items:center;vertical-align:middle;max-width:100%}
.gsp-gap>.gsp-slot,.gsp-gap>.gsp-input,.gsp-gap>.gsp-select{margin-right:0}
.gsp-tries{display:inline-flex;flex-direction:column;gap:3px;margin:0 7px 0 5px;flex:none}
.gsp-tries i{display:block;width:6px;height:6px;border-radius:50%;background:#DCDDE8;transition:background .2s}
.gsp-tries i.on{background:#EF626B}

   const wrap=document.createElement('span');wrap.className='gsp-gap';wrap.append(node);wrap.insertAdjacentHTML('beforeend',`<span class="gsp-tries" aria-hidden="true">${'<i></i>'.repeat(MAX_TRIES)}</span>`);span.replaceWith(wrap);

  words=type==='drag'?shuffle(gaps.map(g=>({id:'w'+g.k,label:g.answers[0],at:null})).concat(split(ex.distractors).map((d,i)=>({id:'x'+i,label:d,at:null})))):[];

 function paint(focusId){
  gaps.forEach(g=>{const n=el(g.k);n.parentNode.querySelectorAll('.gsp-tries i').forEach((d,i)=>d.classList.toggle('on',i<g.tries));n.classList.toggle('is-revealed',g.revealed)});

  if(selected){hint.textContent=`Now ${fine?'click':'tap'} the gap where “${word(selected).label}” belongs.`;hint.classList.add('is-active')}
  else{hint.textContent=done||!gaps.length?'':`Drag a word into a gap, or ${fine?'click':'tap'} a word and then the gap.`;hint.classList.remove('is-active')}

 }
 function finish(){

 /* A wrong answer uses one of the gap's tries; after the last one the correct answer is filled in */
 /* The same wrong answer twice never costs a second try */
 const repeat=(g,v)=>g.tried.has(norm(v));
 function miss(g,v){g.tried.add(norm(v));g.tries++;mistakes++;if(g.tries<MAX_TRIES){g.bad=true;return false}

 function place(id,k){
  if(done)return;const w=word(id),g=gaps[k];if(!w||!g||g.locked)return;selected=null;

   if(isRight(g,w.label)){w.at=k;g.placed=id;g.locked=true;g.bad=false;if(allLocked())return finish();say('Correct!','good');paint()}
   else{if(repeat(g,w.label)){paint();return}if(miss(g,w.label)){paint();if(allLocked())return finish();say('');return}paint();shake(el(k));say(missMsg(g),'bad');setTimeout(()=>{if(g.bad&&!g.locked){g.bad=false;paint()}},900)}

 }
 function unplace(id){const w=word(id);if(!w||w.at===null||gaps[w.at].locked)return;gaps[w.at].placed=null;w.at=null;paint(id)}
 function tap(id){const w=word(id);if(!w||done)return;if(w.at!==null){unplace(id);return}selected=selected===id?null:id;paint(id)}
 /* --- check (after mode, all types) --- */
 function check(){

   if(g.locked)return;
   if(type==='drag'){const w=g.placed&&word(g.placed);if(w&&isRight(g,w.label)){g.locked=true;return}if(w){w.at=null;g.placed=null;if(repeat(g,w.label))return;if(!miss(g,w.label))wrong.push(g.k)}}
   else{const v=el(g.k).value;if(v.trim()&&isRight(g,v)){g.locked=true;g.bad=false;return}if(v.trim()){if(repeat(g,v)){g.bad=true;wrong.push(g.k);return}if(!miss(g,v))wrong.push(g.k)}}
  });

  paint();wrong.forEach(k=>shake(el(k)));
  const good=gaps.filter(g=>g.locked&&!g.revealed).length;
  say(`${good} of ${gaps.length} correct.`+(wrong.length?(type==='drag'?' The wrong words went back to the bank.':' Fix the answers marked in red.'):' Fill in the remaining gaps.')+'','bad');
 }
 /* --- write-in and drop-down, checked while working --- */
 function commit(k){
  const g=gaps[k],n=el(k);if(!g||g.locked||done)return;const v=n.value;if(auto==='during'&&v===g.value)return;g.value=v;
  if(auto!=='during'){if(g.bad){g.bad=false;paint()}return}
  if(!v.trim()){g.bad=false;paint();return}
  if(isRight(g,v)){g.locked=true;g.bad=false;paint();if(allLocked())return finish();say('Correct!','good');
   if(type==='write'){const next=gaps.find(x=>!x.locked&&x.k>k)||gaps.find(x=>!x.locked);if(next&&document.activeElement===n)el(next.k).focus()}}
  else{if(repeat(g,v)){g.bad=true;paint();return}if(miss(g,v)){paint();if(allLocked())return finish();say('');return}paint();shake(n);say(missMsg(g),'bad')}

 if(type==='drag'){
  const dk=DragKit(app,{onTap:tap,onDrop(id,t){selected=null;if(t){place(id,+t.dataset.drop);return}const w=word(id);if(w&&w.at!==null)unplace(id);else paint()}});

<script>

 function cropClamp(){const img=$("matchCropImage"),stage=$("matchCropStage");if(!img.naturalWidth)return;const side=stage.clientWidth||420,w=img.naturalWidth*cropBase*cropZoom,h=img.naturalHeight*cropBase*cropZoom;cropX=Math.max(-Math.max(0,(w-side)/2),Math.min(Math.max(0,(w-side)/2),cropX));cropY=Math.max(-Math.max(0,(h-side)/2),Math.min(Math.max(0,(h-side)/2),cropY));img.style.transform=`translate(${cropX}px,${cropY}px) scale(${cropZoom})`}

 function renderBlocks(){
