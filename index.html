   el.querySelectorAll("[data-field]").forEach(input=>{const key=input.dataset.field;input.value=b[key]||"";input.addEventListener("input",()=>{b[key]=input.value})});
   const imgInput=el.querySelector('[data-file="image"]');if(imgInput)imgInput.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{b.src=r.result;renderBlocks()};r.readAsDataURL(f)});
   const audioInput=el.querySelector('[data-file="audio"]');if(audioInput)audioInput.addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{b.url=r.result;renderBlocks()};r.readAsDataURL(f)});
   el.querySelectorAll("[data-match-label]").forEach(inp=>{const i=+inp.dataset.matchLabel;inp.value=b.items[i].label;inp.addEventListener("input",()=>{b.items[i].label=inp.value;const bank=el.querySelector(".match-word-bank");bank.innerHTML='<span style="color:#a0a8bc;font-size:12px;align-self:center">Word bank is generated from the labels below</span>'+b.items.filter(it=>it.label.trim()).map(it=>`<span class="match-chip">${escapeText(it.label)}</span>`).join("")})});
   el.querySelectorAll("[data-match-upload]").forEach(btn=>btn.addEventListener("click",()=>{const i=+btn.dataset.matchUpload;const input=document.createElement("input");input.type="file";input.accept="image/*";input.onchange=()=>{const f=input.files[0];if(!f)return;if(f.size>8*1024*1024){alert("Please choose an image smaller than 8 MB.");return}const r=new FileReader();r.onload=()=>openMatchCrop(b.id,i,r.result);r.readAsDataURL(f)};input.click()}));
   el.querySelectorAll("[data-match-crop]").forEach(btn=>btn.addEventListener("click",()=>openMatchCrop(b.id,+btn.dataset.matchCrop,b.items[+btn.dataset.matchCrop].src)));
   el.querySelectorAll("[data-field='autoCheck'],[data-field='timed'],[data-field='hide']").forEach(inp=>{const key=inp.dataset.field; if(inp.type==="checkbox")inp.checked=!!b[key];else inp.value=b[key]||"during";inp.addEventListener("change",()=>b[key]=inp.type==="checkbox"?inp.checked:inp.value)});
   el.querySelectorAll("[data-action]").forEach(btn=>btn.addEventListener("click",()=>{
    const action=btn.dataset.action,arr=activeSection().blocks,index=arr.findIndex(x=>x.id===b.id);
    if(action==="delete"){arr.splice(index,1);render();toast("Element deleted")}
    if(action==="edit")openExerciseEditor(b);
    if(action==="duplicate"){const copy=JSON.parse(JSON.stringify(b));copy.id=state.nextBlock++;arr.splice(index+1,0,copy);render();toast("Element duplicated")}
    if(action==="up"&&index>0){[arr[index-1],arr[index]]=[arr[index],arr[index-1]];render()}
    if(action==="down"&&index<arr.length-1){[arr[index+1],arr[index]]=[arr[index],arr[index+1]];render()}
    if(action==="add-match"){b.items.push({label:"",src:""});renderBlocks()}
    if(action==="remove-match"){if(b.items.length<=1){toast("Keep at least one picture");return}b.items.splice(+btn.dataset.index,1);renderBlocks()}
   }));
  });
 }
 /* ===== Interactive exercises: edited in their own constructor, shown here as a summary ===== */
 const GAP_TYPES={drag:"Drag the word to the gap",write:"Type the word in the gap",select:"Select the word from the list"};
 const EDITOR_SOURCE={pictureExercise:"ls-src-picture",gapExercise:"ls-src-gaps"};
 let editing=null;
 function isExercise(b){return b.type==="pictureExercise"||b.type==="gapExercise"}
 function kindLabel(b){
  if(b.type==="pictureExercise")return "Interactive exercise · Drag the word to the image";
  if(b.type==="gapExercise")return "Interactive exercise · "+(GAP_TYPES[b.exercise&&b.exercise.type]||"Fill in the gaps");
  return ({text:"Text",image:"Image",audio:"Audio",video:"Video",pictureMatch:"Interactive exercise · Picture Match"})[b.type]||"Element";
 }
 function exerciseNumber(b){const si=state.sections.findIndex(s=>s.blocks.includes(b));if(si<0)return "1.1";const list=state.sections[si].blocks.filter(isExercise);return (si+1)+"."+(list.indexOf(b)+1)}
 function exerciseSummary(b){
  const e=b.exercise||{},st=e.settings||{};let body="";
  if(b.type==="pictureExercise"){
   const items=e.items||[];
   body=items.length?`<div class="picture-match">${items.map(it=>`<div class="match-card"><div class="match-image">${it.image?`<img src="${it.image}" alt="">`:"▧"}</div><div class="ex-label">${escapeText(it.label)||'<span class="ex-missing">No word</span>'}</div></div>`).join("")}</div>`:'<div class="ex-empty">No pictures yet. Choose “Edit exercise” to add them.</div>';
  }else{
   const t=document.createElement("template");t.innerHTML=e.html||"";
   t.content.querySelectorAll(".gap").forEach(g=>{const p=document.createElement("span");p.className="ex-gap";p.textContent=String(g.dataset.answers||"").split(";")[0].trim()||"…";g.replaceWith(p)});
   t.content.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});
   const d=document.createElement("div");d.append(t.content);
   body=d.textContent.trim()?`<div class="ex-text">${d.innerHTML}</div>`:'<div class="ex-empty">No text yet. Choose “Edit exercise” to write it.</div>';
  }
  const meta=`<span>${exerciseNumber(b)}</span><span>Check answers: ${st.autoCheck==="after"?"after completing":"during the exercise"}</span>${st.timed?`<span>Time limit: ${st.timeLimit||5} min</span>`:""}${st.hide?"<span>Hidden from students</span>":""}<button class="btn primary" type="button" data-action="edit">Edit exercise</button>`;
  return `<div class="ex-summary"><h3>${escapeText(e.heading)||'<span class="ex-missing">No heading</span>'}</h3>${e.instructions?`<p class="ex-instr">${escapeText(e.instructions)}</p>`:""}${body}<div class="ex-meta">${meta}</div></div>`;
 }
 function openExerciseEditor(b){
  editing=b;const wrap=$("exerciseFrameWrap"),frame=document.createElement("iframe");
  frame.className="exercise-frame";frame.title="Exercise editor";
  frame.srcdoc=JSON.parse($(EDITOR_SOURCE[b.type]).textContent).replace("<head>","<head><script>window.LS_EMBED=true<\/script>");
  wrap.replaceChildren(frame);wrap.hidden=false;document.body.style.overflow="hidden";
 }
 function closeExerciseEditor(){editing=null;const wrap=$("exerciseFrameWrap");wrap.hidden=true;wrap.replaceChildren();document.body.style.overflow="";render()}
 function onEditorMessage(e){
  const frame=document.querySelector(".exercise-frame"),d=e.data;
  if(!frame||e.source!==frame.contentWindow||!d||!d.ls||!editing)return;
  if(d.type==="ready")frame.contentWindow.postMessage({ls:1,type:"load",exercise:editing.exercise,number:exerciseNumber(editing)},"*");
  else if(d.type==="save"){editing.exercise=d.exercise;editing.isNew=false;closeExerciseEditor();toast("Exercise saved")}
  else if(d.type==="close"){if(editing.isNew){const sec=state.sections.find(s=>s.blocks.includes(editing));if(sec)sec.blocks.splice(sec.blocks.indexOf(editing),1)}closeExerciseEditor()}
 }
 /* ===== Section preview: everything as students will see it, exercises playable ===== */
 function openPreview(){
  const s=activeSection(),body=$("pvBody");body.replaceChildren();$("pvTitle").textContent=s.title;
  const blocks=s.blocks.filter(b=>!(isExercise(b)&&(!b.exercise||(b.exercise.settings&&b.exercise.settings.hide))));
  blocks.forEach(b=>{
   const sec=document.createElement("section");sec.className="pv-block";
   if(b.type==="text"){if(!String(b.text||"").trim())return;sec.innerHTML=`<p>${escapeText(b.text).replace(/\n/g,"<br>")}</p>`}
   else if(b.type==="image"){if(!b.src)return;sec.innerHTML=`<img src="${b.src}" alt="${escapeText(b.alt)}">`}
   else if(b.type==="audio"){if(!b.url)return;sec.innerHTML=`<audio controls src="${escapeText(b.url)}" style="width:100%"></audio>`}
   else if(b.type==="video"){if(!/^https?:\/\//i.test(b.url||""))return;sec.innerHTML=`<p>Video: <a href="${escapeText(b.url)}" target="_blank" rel="noopener noreferrer">${escapeText(b.url)}</a></p>`}
   else if(b.type==="pictureExercise")mountPlayer(sec,{title:"",exercise:b.exercise},DragKit);
   else if(b.type==="gapExercise")mountGapPlayer(sec,b.exercise,DragKit);
   else return;
   body.appendChild(sec);
  });
  if(!body.children.length)body.innerHTML='<p class="pv-empty">There is nothing to show in this section yet.</p>';
  $("previewOverlay").hidden=false;document.body.style.overflow="hidden";$("pvClose").focus();
 }
 function closePreview(){$("previewOverlay").hidden=true;$("pvBody").replaceChildren();document.body.style.overflow=""}
 function render(){renderSections();renderBlocks()}
 function openDrawer(){
  $("drawerTitle").textContent="Add an element";
  $("drawerDescription").textContent="Choose content or an interactive exercise to add to this section.";
  const box=$("libraryItems");box.innerHTML="";
  [["Content",library.content],["Interactive exercises",library.exercises]].forEach(([label,items])=>{
   box.insertAdjacentHTML("beforeend",`<div class="library-group">${label}</div>`);
   items.forEach(item=>{const b=document.createElement("button");b.type="button";b.className="library-item";b.innerHTML=`<span class="library-icon">${item.icon}</span><span><strong>${item.name}</strong><small>${item.desc}</small></span>`;b.addEventListener("click",()=>addBlock(item.type));box.appendChild(b)});
  });
  $("libraryDrawer").classList.add("open");const first=box.querySelector("button");if(first)first.focus();
 }
 document.addEventListener("click",e=>{const d=$("libraryDrawer");if(d.classList.contains("open")&&!d.contains(e.target)&&!e.target.closest("#emptyAdd,#addAnotherBtn"))closeDrawer()});
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("libraryDrawer").classList.contains("open"))closeDrawer()});
 function closeDrawer(){$("libraryDrawer").classList.remove("open");document.querySelectorAll(".tool[data-drawer]").forEach(t=>t.classList.remove("active"))}
 document.querySelectorAll(".tool[data-drawer]").forEach(b=>b.addEventListener("click",()=>openDrawer(b.dataset.drawer)));
 $("closeDrawer").addEventListener("click",closeDrawer);
 $("emptyAdd").addEventListener("click",()=>openDrawer());
 $("addAnotherBtn").addEventListener("click",()=>openDrawer());
 $("addSection").addEventListener("click",()=>{const s={id:state.nextSection++,title:"Section "+(state.sections.length+1),blocks:[]};state.sections.push(s);state.active=s.id;render();toast("Section added")});
 $("renameSection").addEventListener("click",()=>{const s=activeSection();const name=prompt("Section name:",s.title);if(name&&name.trim()){s.title=name.trim();renderSections()}});
 $("clearCanvas").addEventListener("click",()=>{if(confirm("Remove all elements from this section?")){activeSection().blocks=[];render();toast("Section cleared")}});
 $("saveLesson").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lesson-studio-draft.json";a.click();URL.revokeObjectURL(a.href);toast("Lesson draft downloaded as JSON")});
 $("matchCropClose").addEventListener("click",closeMatchCrop);
 $("matchCropCancel").addEventListener("click",closeMatchCrop);
 $("matchCropSave").addEventListener("click",saveMatchCrop);
 $("matchZoomIn").addEventListener("click",()=>{cropZoom=Math.min(4,cropZoom+.1);cropClamp()});
 $("matchZoomOut").addEventListener("click",()=>{cropZoom=Math.max(1,cropZoom-.1);cropClamp()});
 $("matchCropReset").addEventListener("click",()=>{cropZoom=1;cropX=0;cropY=0;cropPrepare()});
 $("matchCropStage").addEventListener("pointerdown",e=>{if(!cropContext)return;cropDrag={x:e.clientX,y:e.clientY,ox:cropX,oy:cropY};$("matchCropStage").setPointerCapture?.(e.pointerId)});
 $("matchCropStage").addEventListener("pointermove",e=>{if(!cropDrag)return;cropX=cropDrag.ox+e.clientX-cropDrag.x;cropY=cropDrag.oy+e.clientY-cropDrag.y;cropClamp()});
 $("matchCropStage").addEventListener("pointerup",()=>cropDrag=null);
 $("matchCropStage").addEventListener("pointercancel",()=>cropDrag=null);
 $("previewBtn").addEventListener("click",openPreview);
 $("pvClose").addEventListener("click",closePreview);
 document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("previewOverlay").hidden)closePreview()});
 window.addEventListener("message",onEditorMessage);
 function escapeHtml(str){return String(str||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
 render();
})();
</script>
